[workspace]
resolver = "3"
members = ["crates/*", "apps/juto", "apps/juto-cli"]
default-members = ["apps/juto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["x11", "wayland"] }
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
globset = "0.4"
ignore = "0.4"
jsonschema = { version = "0.33", default-features = false }
libc = "=0.2.186"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "io-util", "net", "process", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-segmentation = "1.13"
uuid = { version = "1", features = ["v7", "serde"] }
juto-catalog = { path = "crates/juto-catalog" }
juto-ai = { path = "crates/juto-ai" }
juto-agent = { path = "crates/juto-agent" }
juto-runtime = { path = "crates/juto-runtime" }

# Favor iteration speed over optimized application/dependency code.
[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.test]
opt-level = 0
debug = 1
incremental = true
