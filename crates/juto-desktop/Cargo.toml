[package]
name = "juto-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Headless agent-first desktop environment compositor and supervisor for Juto"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
parking_lot = "0.12"
bytes = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
glib = { workspace = true }
gstreamer = { workspace = true }
juto-capacity.workspace = true
gstreamer-app = { workspace = true }
gstreamer-sdp = { workspace = true }
gstreamer-video = { workspace = true }
gstreamer-webrtc = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
smithay = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }

[[bin]]
name = "juto-desktop"
path = "src/bin/juto-desktop.rs"

[[example]]
name = "test_client"
path = "examples/test_client.rs"
